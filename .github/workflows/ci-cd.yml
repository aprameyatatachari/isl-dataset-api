name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: "3.12"

# A new push to the same ref cancels the previous run instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # CI: Linting & Code Formatting
  # ---------------------------------------------------------------------------
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Linting & Formatting Tools
        # Versions are pinned: an unpinned formatter turns an upstream style release into
        # a red pipeline on code that never changed.
        run: |
          python -m pip install --upgrade pip
          pip install "flake8==7.1.1" "black==24.10.0" "isort==5.13.2"

      - name: Check Code Formatting (Black)
        run: black --check --diff .

      - name: Check Import Order (isort)
        run: isort --check-only --profile black .

      - name: Lint Code (flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max line length tuned for black compatibility.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

  # ---------------------------------------------------------------------------
  # CI: Import & behaviour smoke test
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Import & Unit Smoke Test
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import app and exercise pure helpers
        # No network here: this only proves the module imports cleanly and the parsing /
        # normalization logic behaves. Live scraping is covered by the container run below.
        run: |
          python - <<'PY'
          import main

          assert main.slugify("A (Alphabet)") == "a-alphabet"
          assert main.slugify("  How Are  YOU ") == "how-are-you"
          assert main.slugify("!!!") == ""
          assert main.normalize_media_url("//www.youtube.com/embed/x", page_url="https://a/b/") \
              == "https://www.youtube.com/embed/x"

          html = '<div><iframe class="youtube-player" src="//www.youtube.com/embed/dQw4w9WgXcQ"></iframe></div>'
          assert main.extract_youtube_url(html, page_url="https://x/") \
              == "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
          assert main.extract_youtube_url("<p>nothing</p>", page_url="https://x/") is None

          index_html = (
              '<ul class="az-columns"><li><a href="https://indiansignlanguage.org/apple/">Apple</a></li>'
              '<li><a href="/how-are-you/">How are you</a></li></ul>'
          )
          entries = main.parse_index(index_html)
          assert set(entries) == {"apple", "how-are-you"}, entries

          print("smoke test OK:", main.app.title, main.app.version)
          PY

  # ---------------------------------------------------------------------------
  # CD: Build and Push Docker Image to GHCR
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image
    needs: [lint, smoke-test]
    # Only run CD on pushes to target branches/tags (skips non-merged PR builds)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
